# Local development database only. Not a production deployment file.
services:
  postgres:
    image: postgres:16-alpine
    container_name: crisislens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crisislens
      POSTGRES_PASSWORD: crisislens
      POSTGRES_DB: crisislens
    ports:
      - '5432:5432'
    volumes:
      - crisislens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crisislens -d crisislens']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crisislens-pgdata:
